{% extends "base.html" %}
{% block title %}Início{% endblock %}
{% block content %}
<h1>Olá, {{ user.get_short_name }}</h1>
<section class="card">
  <h2>Minha conta</h2>
  <dl class="details">
    <dt>Nome</dt><dd>{{ user.full_name }}</dd>
    <dt>E-mail</dt><dd>{{ user.email }}</dd>
    <dt>Perfis</dt><dd>{{ user.role_names|join:", "|default:"Nenhum perfil atribuído" }}</dd>
  </dl>
</section>
{% endblock %}
